name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test offline SDK examples
        run: |
          bun run examples/key-rotation.ts
          bun run examples/key-affinity.ts
          bun run examples/offline-diagnostics.ts
          bun run examples/credit-guards.ts
          bun run examples/local-artifact-cache.ts
      - name: Install locked docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build and typecheck docs
        working-directory: docs
        run: bun run build
      - name: Validate internal links
        working-directory: docs
        run: bun run check:links
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
